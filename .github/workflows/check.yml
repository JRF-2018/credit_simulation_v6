name: Check JS model against Python reference

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy and quickjs
        run: python -m pip install numpy quickjs
      - name: Compare
        run: python python/check_js_vs_py.py
